<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환승 통로 — 코어 프로토타입</title>
<style>
  :root{ --paper:#EDEFF2; --panel:#fff; --ink:#1B1D21; --soft:#5C626B;
         --line:#D3D8DE; --accent:#2F6F6B; --warn:#A3324A; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);padding:20px 16px 48px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--soft)}
  canvas{display:block;width:100%;height:auto;background:#fff;
         border:1px solid var(--line);border-radius:6px;touch-action:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:12px}
  .stat{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
  .stat b{color:var(--ink);font-weight:600}
  .keys{margin-top:8px;font-size:12px;color:var(--soft);line-height:1.9}
  kbd{font:inherit;font-size:11px;background:#F4F6F8;border:1px solid var(--line);
      border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink)}
  .note{font-size:12.5px;color:var(--soft);line-height:1.65;margin-top:10px}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>환승 통로 — 코어 프로토타입</h1>
  <span class="sub">폰에만 길이 있고, 전방에만 사람이 있습니다</span></header>

  <canvas id="cv" width="960" height="540"></canvas>

  <div class="panel">
    <div class="stat">시간 <b id="t">0.0</b>s · 부딪힘 <b id="h">0</b> · 길 잘못 듦 <b id="w">0</b> · 고개 <b id="a">0</b>°</div>
    <div class="keys">
      <kbd>← →</kbd> 좌우 이동 · <kbd>Space</kbd> <b>누르고 있는 동안</b> 고개 듦 · <kbd>R</kbd> 재시작 ·
      <kbd>[</kbd> <kbd>]</kbd> 고개 비용 (나중용, 지금은 건드리지 마세요)
    </div>
    <div class="note">
      <b>판정 기준 하나:</b> Space를 언제 누를지 고민하게 되는가. 고민이 안 되고 그냥 계속 누르고
      있게 된다면 코어가 실패한 겁니다. 전진은 자동입니다.
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 960, H = 540, CX = W/2, CY = H/2;
const FOV = 75 * Math.PI/180, FL = (W/2) / Math.tan(FOV/2);
const NEAR = 0.12;
const EYE = 1.62;          // 눈높이
const HALF = 3.5;          // 복도 반폭
const CEIL = 3.0;
const SPEED = 6.0;         // 자동 전진 m/s
const LANES = [-2.3, 0, 2.3];
const LANE_NAME = ['왼쪽', '가운데', '오른쪽'];
const GOAL_Z = 210;

const C = { bg:'#F7F9FB', floor:'#E9EDF1', wall:'#DCE2E8', wall2:'#D0D7DF',
            arch:'#2B3138', ped:'#7C848E', pedHead:'#69717B',
            ink:'#1B1D21', accent:'#2F6F6B', warn:'#A3324A' };

// ── 고개 비용 (나중에 날짜별로 바꿀 값) ───────────
const cost = { rest:0.72, top:0.03, up:2.4, down:1.7 };
let level = 0;   // 0 = 1일차 상태
function applyLevel(){
  cost.rest = 0.72 + level * 0.05;
  cost.top  = 0.03 + level * 0.07;
  cost.up   = 2.4  - level * 0.28;
  cost.down = 1.7  + level * 0.30;
}

// ── 상태 ─────────────────────────────────────────
let px, pvx, pz, pitch, t, hits, wrongs, stun, flash, done;
let gates, peds, msgs, msgTimer, chatIdx, penalty;

const CHAT = [
  '박PM: 오전 스탠드업 10분 미뤄요',
  '이 대리: 어제 배포 롤백됐대요',
  '알림: 캘린더 — 스프린트 리뷰 11:00',
  '박PM: 그 티켓 누가 잡고 있죠',
  '김 팀장: 오후에 잠깐 봅시다',
  '알림: 배터리 20% 남음',
  '이 대리: QA 시트 링크 다시 주실 수 있나요',
  '박PM: 아 제가 잘못 봤네요 무시하세요',
  '알림: 결제 승인 4,500원',
  '김 팀장: 그거 어제 얘기한 거랑 다른데',
  '이 대리: 저 지금 3번 출구쪽이에요',
  '알림: 미팅 시작 15분 전',
];

function reset(){
  px = 0; pvx = 0; pz = 0; pitch = cost.rest;
  t = 0; hits = 0; wrongs = 0; stun = 0; flash = 0; done = false;
  penalty = 0; msgTimer = 0; chatIdx = 0;
  msgs = [{ text:'김 팀장: 늦지 마요', hi:false }];
  gates = [40, 85, 130, 175].map(z => ({
    z, lane: Math.floor(Math.random()*3), told:false, judged:false
  }));
  peds = [];
  for (let z = 18; z < GOAL_Z; z += 5.5 + Math.random()*5){
    // 게이트 근처는 비워둠
    if (gates.some(g => Math.abs(g.z - z) < 7)) continue;
    peds.push({ x:(Math.random()*2-1)*2.9, z, v:1.4 + Math.random()*0.9,
                sway:Math.random()*6.28 });
  }
}

// ── 입력 ─────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  if ([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  if (k === 'r') reset();
  if (k === '[') { level = Math.max(0, level-1); applyLevel(); }
  if (k === ']') { level = Math.min(6, level+1); applyLevel(); }
  keys[k] = true; if (e.key === ' ') keys[' '] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if (e.key === ' ') keys[' '] = false; });

// ── 갱신 ─────────────────────────────────────────
function step(dt){
  if (done) return;
  t += dt;
  if (stun > 0) stun -= dt;
  if (flash > 0) flash -= dt * 2.5;
  if (penalty > 0){ penalty -= dt; return; }   // "되돌아옴" 정지

  // 고개
  const up = keys[' '] || keys['arrowup'];
  const target = up ? cost.top : cost.rest;
  const rate = up ? cost.up : cost.down;
  if (pitch > target) pitch = Math.max(target, pitch - rate*dt);
  else pitch = Math.min(target, pitch + rate*dt);

  // 좌우
  const L = keys['arrowleft'] || keys['a'], R = keys['arrowright'] || keys['d'];
  const acc = (stun > 0) ? 0 : 26;
  if (L && !R) pvx -= acc*dt; else if (R && !L) pvx += acc*dt;
  else pvx -= Math.sign(pvx) * Math.min(Math.abs(pvx), 30*dt);
  pvx = Math.max(-4.6, Math.min(4.6, pvx));
  px += pvx*dt;
  if (px < -HALF+0.4){ px = -HALF+0.4; pvx = 0; }
  if (px >  HALF-0.4){ px =  HALF-0.4; pvx = 0; }

  pz += SPEED * (stun > 0 ? 0.35 : 1) * dt;

  // 보행자
  for (const p of peds){
    p.z -= p.v*dt;
    p.sway += dt*3;
    const dz = p.z - pz;
    if (dz > -0.6 && dz < 0.6 && Math.abs(p.x + Math.sin(p.sway)*0.12 - px) < 0.62 && stun <= 0){
      hits++; stun = 0.55; flash = 1; pvx = -Math.sign(px - p.x) * 2.2;
    }
  }

  // 게이트 판정
  for (const g of gates){
    if (!g.told && g.z - pz < 34){
      g.told = true;
      pushMsg(`지도: 환승 통로 — ${LANE_NAME[g.lane]}`, true);
    }
    if (!g.judged && pz > g.z){
      g.judged = true;
      let near = 0, best = 1e9;
      LANES.forEach((lx, i) => { const d = Math.abs(px - lx); if (d < best){ best = d; near = i; } });
      if (near !== g.lane){ wrongs++; penalty = 1.6; flash = 1; }
    }
  }

  // 잡담
  msgTimer += dt;
  if (msgTimer > 2.6){ msgTimer = 0; pushMsg(CHAT[chatIdx++ % CHAT.length], false); }

  if (pz >= GOAL_Z) done = true;
}
function pushMsg(text, hi){ msgs.push({ text, hi }); if (msgs.length > 7) msgs.shift(); }

// ── 3D ───────────────────────────────────────────
function toCam(x, y, z){
  const rx = x - px, ry = y - EYE, rz = z - pz;
  const c = Math.cos(pitch), s = Math.sin(pitch);
  return { x:rx, y:ry*c + rz*s, z:-ry*s + rz*c };
}
function clipNear(pts){
  const out = [];
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i+1) % pts.length];
    const ain = a.z >= NEAR, bin = b.z >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin){
      const k = (NEAR - a.z) / (b.z - a.z);
      out.push({ x:a.x + (b.x-a.x)*k, y:a.y + (b.y-a.y)*k, z:NEAR });
    }
  }
  return out;
}
function proj(p){ return { x:CX + p.x/p.z*FL, y:CY - p.y/p.z*FL }; }
function fog(hex, d){
  const k = Math.min(1, Math.max(0, (d - 8) / 55));
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const br = 247, bg = 249, bb = 251;
  return `rgb(${Math.round(r+(br-r)*k)},${Math.round(g+(bg-g)*k)},${Math.round(b+(bb-b)*k)})`;
}

const polys = [];
function quad(pts3, color){
  const cam = pts3.map(p => toCam(p[0], p[1], p[2]));
  const cl = clipNear(cam);
  if (cl.length < 3) return;
  let d = 0; for (const p of cl) d += p.z; d /= cl.length;
  polys.push({ d, pts: cl.map(proj), color: fog(color, d) });
}

function scene(){
  polys.length = 0;
  const z0 = Math.floor(pz/3)*3;
  for (let z = z0 - 3; z < z0 + 72; z += 3){
    if (z > GOAL_Z + 6) break;
    const shade = ((z/3)|0) % 2 ? C.floor : '#E3E8ED';
    quad([[-HALF,0,z],[HALF,0,z],[HALF,0,z+3],[-HALF,0,z+3]], shade);
    const ws = ((z/3)|0) % 2 ? C.wall : C.wall2;
    quad([[-HALF,0,z],[-HALF,CEIL,z],[-HALF,CEIL,z+3],[-HALF,0,z+3]], ws);
    quad([[ HALF,0,z],[ HALF,CEIL,z],[ HALF,CEIL,z+3],[ HALF,0,z+3]], ws);
  }
  // 차선 표시 — 바닥에만, 어느 통로가 맞는지는 알려주지 않음
  for (const lx of [-1.15, 1.15]){
    for (let z = z0; z < z0 + 60; z += 6)
      quad([[lx-0.05,0.01,z],[lx+0.05,0.01,z],[lx+0.05,0.01,z+3],[lx-0.05,0.01,z+3]], '#C9D1D9');
  }
  // 게이트 — 세 통로가 완전히 동일하게 보여야 함
  for (const g of gates){
    if (g.z < pz - 4 || g.z > pz + 70) continue;
    for (const lx of [-3.5,-1.15,1.15,3.5]){
      quad([[lx-0.12,0,g.z],[lx+0.12,0,g.z],[lx+0.12,CEIL,g.z],[lx-0.12,CEIL,g.z]], C.arch);
    }
    quad([[-HALF,CEIL-0.45,g.z],[HALF,CEIL-0.45,g.z],[HALF,CEIL,g.z],[-HALF,CEIL,g.z]], C.arch);
  }
  // 보행자
  for (const p of peds){
    const dz = p.z - pz;
    if (dz < -1 || dz > 70) continue;
    const x = p.x + Math.sin(p.sway)*0.12;
    quad([[x-0.32,0,p.z],[x+0.32,0,p.z],[x+0.32,1.42,p.z],[x-0.32,1.42,p.z]], C.ped);
    quad([[x-0.17,1.42,p.z],[x+0.17,1.42,p.z],[x+0.17,1.76,p.z],[x-0.17,1.76,p.z]], C.pedHead);
  }
  // 도착선
  if (GOAL_Z - pz < 70)
    quad([[-HALF,0.02,GOAL_Z],[HALF,0.02,GOAL_Z],[HALF,0.02,GOAL_Z+1.2],[-HALF,0.02,GOAL_Z+1.2]], C.accent);

  polys.sort((a,b) => b.d - a.d);
  for (const q of polys){
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.moveTo(q.pts[0].x, q.pts[0].y);
    for (let i = 1; i < q.pts.length; i++) ctx.lineTo(q.pts[i].x, q.pts[i].y);
    ctx.closePath(); ctx.fill();
  }
}

// ── 폰 ───────────────────────────────────────────
function phone(){
  const k = Math.max(0, Math.min(1, (pitch - 0.18) / (cost.rest - 0.18)));
  if (k <= 0.001) return;
  const PW = 292, PH = 396;
  const x = CX - PW/2 + 6, y = H - 26 - PH*k + (1-k)*40;

  ctx.save();
  ctx.shadowColor = 'rgba(20,24,30,0.18)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = -6;
  ctx.fillStyle = '#20242A';
  round(x-8, y-8, PW+16, PH+16, 22); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#FBFCFD';
  round(x, y, PW, PH, 15); ctx.fill();
  ctx.restore();

  // 고개를 들면 글자가 안 읽혀야 함
  const blur = (1 - k) * 7;
  ctx.save();
  ctx.beginPath(); round(x, y, PW, PH, 15); ctx.clip();
  if (blur > 0.35 && 'filter' in ctx) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  ctx.globalAlpha = 0.35 + 0.65*k;

  ctx.fillStyle = '#8A9099'; ctx.font = '11px ui-monospace, monospace';
  ctx.fillText('08:41', x+16, y+24);
  ctx.fillText('팀 채널', x+PW-62, y+24);
  ctx.fillStyle = '#E6E9ED'; ctx.fillRect(x+14, y+34, PW-28, 1);

  let ly = y + 62;
  for (const m of msgs){
    const lines = wrap(m.text, PW-46, m.hi ? '600 13.5px' : '12.5px');
    const bh = lines.length*19 + 14;
    ctx.fillStyle = m.hi ? '#E3F0EE' : '#F1F3F6';
    round(x+14, ly-14, PW-28, bh, 9); ctx.fill();
    if (m.hi){ ctx.fillStyle = C.accent; ctx.fillRect(x+14, ly-14, 3, bh); }
    ctx.fillStyle = m.hi ? '#1E4F4B' : '#4A5058';
    ctx.font = (m.hi ? '600 13.5px' : '12.5px') + ' ui-sans-serif, system-ui, sans-serif';
    lines.forEach((s, i) => ctx.fillText(s, x+26, ly + i*19));
    ly += bh + 8;
  }
  ctx.restore();
}
function wrap(text, maxw, font){
  ctx.font = font + ' ui-sans-serif, system-ui, sans-serif';
  const out = []; let cur = '';
  for (const ch of text){
    if (ctx.measureText(cur + ch).width > maxw){ out.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function round(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

// ── 렌더 ─────────────────────────────────────────
function draw(){
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  scene();

  // 주변 시야 감쇠
  const v = ctx.createRadialGradient(CX, CY, H*0.30, CX, CY, H*0.86);
  v.addColorStop(0, 'rgba(247,249,251,0)');
  v.addColorStop(1, 'rgba(232,236,240,0.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  phone();

  if (flash > 0){
    ctx.fillStyle = `rgba(163,50,74,${0.20*Math.min(1,flash)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (penalty > 0){
    ctx.fillStyle = 'rgba(255,255,255,0.86)'; ctx.fillRect(0, 200, W, 92);
    ctx.fillStyle = C.warn; ctx.font = '600 20px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('잘못된 통로 — 되돌아옴', CX, 252); ctx.textAlign = 'left';
  }
  // 화면 내 표시
  ctx.fillStyle = C.ink; ctx.font = '600 14px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(`${t.toFixed(1)}s`, 20, 30);
  ctx.fillStyle = '#5C626B'; ctx.font = '12px ui-monospace, monospace';
  ctx.fillText(`고개 ${(pitch*180/Math.PI).toFixed(0)}°${level ? '  ·  비용 +' + level : ''}`, 20, 50);
  if (!keys[' '] && pitch > cost.rest - 0.05 && t < 4){
    ctx.fillStyle = C.accent; ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('Space를 누르고 있으면 고개를 듭니다', 20, 74);
  }
  if (done){
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(0, 190, W, 120);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink; ctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(`도착 — ${t.toFixed(1)}초 · 부딪힘 ${hits} · 길 잘못 듦 ${wrongs}`, CX, 238);
    ctx.font = '13px ui-sans-serif, system-ui, sans-serif'; ctx.fillStyle = '#5C626B';
    ctx.fillText('R로 다시 (통로 정답은 매번 바뀝니다)', CX, 268);
    ctx.textAlign = 'left';
  }
}

// ── 루프 ─────────────────────────────────────────
const el = { t:document.getElementById('t'), h:document.getElementById('h'),
             w:document.getElementById('w'), a:document.getElementById('a') };
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  step(dt); draw();
  el.t.textContent = t.toFixed(1); el.h.textContent = hits;
  el.w.textContent = wrongs; el.a.textContent = (pitch*180/Math.PI).toFixed(0);
  requestAnimationFrame(loop);
}
applyLevel(); reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
